<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">CyberGuardian Packet Observatory interface preview</title>
  <desc id="desc">Defensive Wireshark-style metadata panel with packet rows, protocol distribution, conversation map and audit chain.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#070d14"/><stop offset=".55" stop-color="#0a1720"/><stop offset="1" stop-color="#1c1117"/></linearGradient>
    <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#14252d" stop-opacity=".95"/><stop offset="1" stop-color="#080e16" stop-opacity=".98"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#70f3f2" stroke-opacity=".07"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.mono{font-family:Consolas,monospace;letter-spacing:1.6px}.display{font-family:Arial Narrow,Arial,sans-serif}.text{fill:#e8f2ed}.muted{fill:#93a8ab}.dim{fill:#566c73}.cyan{fill:#70f3f2}.red{fill:#ff4c3a}.orange{fill:#ff9b52}.green{fill:#8cf0ad}.pink{fill:#f168d4}.small{font-size:11px}.tiny{font-size:9px}</style>
  </defs>
  <rect width="1440" height="900" fill="#05070d"/><rect width="1440" height="900" fill="url(#bg)"/><rect x="251" y="69" width="1189" height="831" fill="url(#grid)"/>
  <rect width="1440" height="64" fill="#080d14" stroke="#536e76" stroke-opacity=".38"/><rect y="63" width="1440" height="2" fill="#70f3f2" fill-opacity=".2"/>
  <g transform="translate(22 18)"><rect width="29" height="27" fill="none" stroke="#70f3f2"/><rect x="5" y="15" width="4" height="8" fill="#70f3f2"/><rect x="12" y="9" width="4" height="14" fill="#70f3f2"/><rect x="19" y="3" width="4" height="20" fill="#ff4c3a"/><text x="41" y="13" class="display text" font-size="17" font-weight="bold">CYBERGUARDIAN</text><text x="41" y="27" class="mono dim tiny">SOT / DEFENSE OPS</text></g>
  <text x="300" y="37" class="mono dim small">/</text><text x="321" y="37" class="mono cyan small">DEFENSE OPS</text><circle cx="1210" cy="31" r="5" fill="#8cf0ad" filter="url(#glow)"/><text x="1224" y="36" class="mono green tiny">PLANE SYNC / LIVE</text><text x="1337" y="36" class="mono text small">18:44:22 UTC</text>
  <rect y="65" width="242" height="835" fill="#070c13" stroke="#536e76" stroke-opacity=".25"/><text x="26" y="102" class="mono dim tiny">OPERATIONS / 07</text>
  <g class="mono small"><rect x="18" y="124" width="208" height="42" fill="none" stroke="#536e76" stroke-opacity=".25"/><text x="31" y="150" class="dim">01</text><text x="70" y="150" class="muted">◈  COMMAND DECK</text><rect x="18" y="175" width="208" height="42" fill="none" stroke="#536e76" stroke-opacity=".25"/><text x="31" y="201" class="dim">02</text><text x="70" y="201" class="muted">✣  AGENT MESH</text><rect x="18" y="226" width="208" height="42" fill="none" stroke="#536e76" stroke-opacity=".25"/><text x="31" y="252" class="dim">03</text><text x="70" y="252" class="muted">⌁  HONEYPOT LAB</text><rect x="18" y="277" width="208" height="42" fill="#10262d" stroke="#70f3f2" stroke-opacity=".55"/><text x="31" y="303" class="cyan">04</text><text x="70" y="303" class="text">⌘  DEFENSE OPS</text><rect x="18" y="328" width="208" height="42" fill="none" stroke="#536e76" stroke-opacity=".25"/><text x="31" y="354" class="dim">05</text><text x="70" y="354" class="muted">▦  TOOL ATLAS</text><rect x="18" y="379" width="208" height="42" fill="none" stroke="#536e76" stroke-opacity=".25"/><text x="31" y="405" class="dim">06</text><text x="70" y="405" class="muted">⟡  SIGNAL DRIFT</text></g>
  <rect x="18" y="658" width="208" height="142" fill="#0d1e23" stroke="#8cf0ad" stroke-opacity=".28"/><circle cx="36" cy="683" r="5" fill="#8cf0ad"/><text x="50" y="688" class="mono green tiny">SAFETY RAIL</text><text x="190" y="688" class="mono green tiny">ON</text><text x="31" y="718" class="display muted" font-size="13">Metadata only.</text><text x="31" y="738" class="display muted" font-size="13">No payload. No response.</text><rect x="31" y="775" width="181" height="3" fill="#8cf0ad" fill-opacity=".2"/><rect x="31" y="775" width="181" height="3" fill="#8cf0ad"/><text x="31" y="793" class="mono green tiny">BOUNDED / READ ONLY</text>

  <g transform="translate(280 105)"><text class="mono cyan tiny">LOCAL TOOLCHAIN / BOUNDED PACKET METADATA</text><text y="53" class="display text" font-size="63" font-weight="bold">PACKET <tspan class="red">OBSERVATORY</tspan></text><text y="82" class="display muted" font-size="17">Wireshark-style visibility without payload access or response paths.</text></g>
  <rect x="280" y="224" width="1130" height="68" fill="#2c191f" stroke="#ff9b52" stroke-opacity=".35"/><text x="305" y="248" class="mono orange tiny">WHAT THIS VIEW DOES</text><text x="305" y="274" class="display text" font-size="18">Reads time, source, destination and protocol — then keeps the evidence local.</text><rect x="1213" y="243" width="166" height="30" fill="#ff4c3a"/><text x="1231" y="263" class="mono" fill="#160809" font-size="9" font-weight="bold">SAFE BOUNDARY / ON</text>

  <rect x="280" y="316" width="711" height="264" fill="url(#panel)" stroke="#70f3f2" stroke-opacity=".35"/><text x="304" y="348" class="mono dim tiny">01 / WIRESHARK BRIDGE</text><text x="304" y="380" class="display text" font-size="27" font-weight="bold">HEADER METADATA</text><rect x="793" y="337" width="169" height="25" fill="#0f2c28" stroke="#8cf0ad" stroke-opacity=".4"/><text x="812" y="354" class="mono green tiny">TSHARK / SAFE DEMO</text>
  <g transform="translate(304 405)"><rect width="663" height="27" fill="#081118"/><text x="8" y="18" class="mono dim tiny">TIME</text><text x="82" y="18" class="mono dim tiny">SOURCE</text><text x="310" y="18" class="mono dim tiny">DESTINATION</text><text x="588" y="18" class="mono dim tiny">PROTO</text><line x1="0" y1="28" x2="663" y2="28" stroke="#5c7a83" stroke-opacity=".28"/>
    <text x="8" y="52" class="mono muted tiny">+0.00s</text><text x="82" y="52" class="mono text tiny">192.0.2.10:51834</text><text x="310" y="52" class="mono text tiny">192.0.2.1:443</text><text x="588" y="52" class="mono orange tiny">TCP</text><line x1="0" y1="65" x2="663" y2="65" stroke="#5c7a83" stroke-opacity=".15"/>
    <text x="8" y="89" class="mono muted tiny">+0.42s</text><text x="82" y="89" class="mono text tiny">198.51.100.7:41201</text><text x="310" y="89" class="mono text tiny">203.0.113.5:53</text><text x="588" y="89" class="mono orange tiny">DNS</text><line x1="0" y1="102" x2="663" y2="102" stroke="#5c7a83" stroke-opacity=".15"/>
    <text x="8" y="126" class="mono muted tiny">+0.84s</text><text x="82" y="126" class="mono text tiny">203.0.113.5:55422</text><text x="310" y="126" class="mono text tiny">198.51.100.7:443</text><text x="588" y="126" class="mono orange tiny">HTTPS</text>
  </g><text x="304" y="552" class="mono green tiny">3 ROWS / NO PAYLOAD CONTENT / LOCAL ONLY</text>

  <rect x="1010" y="316" width="400" height="264" fill="#130d19" stroke="#f168d4" stroke-opacity=".35"/><text x="1034" y="348" class="mono dim tiny">02 / PROTOCOL DISTRIBUTION</text><text x="1034" y="380" class="display text" font-size="27" font-weight="bold">WHAT <tspan class="pink">MOVES?</tspan></text><g transform="translate(1035 419)" class="mono tiny"><text y="0" class="muted">TCP</text><rect x="45" y="-9" width="285" height="7" fill="#70f3f2" fill-opacity=".12"/><rect x="45" y="-9" width="250" height="7" fill="#f168d4"/><text x="350" y="0" class="text">01</text><text y="43" class="muted">DNS</text><rect x="45" y="34" width="285" height="7" fill="#70f3f2" fill-opacity=".12"/><rect x="45" y="34" width="166" height="7" fill="#f168d4"/><text x="350" y="43" class="text">01</text><text y="86" class="muted">HTTPS</text><rect x="45" y="77" width="285" height="7" fill="#70f3f2" fill-opacity=".12"/><rect x="45" y="77" width="217" height="7" fill="#f168d4"/><text x="350" y="86" class="text">01</text></g><text x="1034" y="548" class="mono dim tiny">HEADER METADATA / NO CONTENT</text>

  <rect x="280" y="604" width="1130" height="217" fill="url(#panel)" stroke="#ff9b52" stroke-opacity=".35"/><text x="304" y="637" class="mono orange tiny">03 / DEFENSIVE CORRELATION</text><text x="304" y="669" class="display text" font-size="27" font-weight="bold">PACKET → DECOY → INCIDENT → AUDIT</text>
  <g transform="translate(304 700)"><g><rect width="225" height="72" fill="#0b1d1d" stroke="#8cf0ad" stroke-opacity=".5"/><text x="14" y="21" class="mono dim tiny">01 / PACKETS</text><text x="14" y="49" class="mono green small">03 ROWS</text></g><text x="237" y="43" class="display orange" font-size="21">→</text><g transform="translate(270)"><rect width="225" height="72" fill="#101d22" stroke="#70f3f2" stroke-opacity=".45"/><text x="14" y="21" class="mono dim tiny">02 / DECOY</text><text x="14" y="49" class="mono cyan small">KASA-API</text></g><text x="507" y="43" class="display orange" font-size="21">→</text><g transform="translate(540)"><rect width="225" height="72" fill="#25161b" stroke="#ff4c3a" stroke-opacity=".5"/><text x="14" y="21" class="mono dim tiny">03 / INCIDENT</text><text x="14" y="49" class="mono red small">INC-014 OPEN</text></g><text x="777" y="43" class="display orange" font-size="21">→</text><g transform="translate(810)"><rect width="225" height="72" fill="#1d1322" stroke="#f168d4" stroke-opacity=".45"/><text x="14" y="21" class="mono dim tiny">04 / AUDIT</text><text x="14" y="49" class="mono pink small">RECORDED</text></g></g>
</svg>
