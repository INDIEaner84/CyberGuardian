<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">CyberGuardian Design Lab interface preview</title>
  <desc id="desc">Landing page with four selectable CyberGuardian design directions: Nightwatch HUD, Agent Orbit, Tactical Console and Incident Theatre.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#05070d"/><stop offset=".56" stop-color="#0c1820"/><stop offset="1" stop-color="#211117"/></linearGradient>
    <linearGradient id="card" x2="0" y2="1"><stop stop-color="#14242d" stop-opacity=".94"/><stop offset="1" stop-color="#080e16" stop-opacity=".95"/></linearGradient>
    <pattern id="grid" width="47" height="47" patternUnits="userSpaceOnUse"><path d="M47 0H0V47" fill="none" stroke="#70f3f2" stroke-opacity=".07"/></pattern>
    <filter id="glowR"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.mono{font-family:Consolas,monospace;letter-spacing:2px}.display{font-family:Arial Narrow,Arial,sans-serif}.text{fill:#e8f2ed}.muted{fill:#93a8ab}.dim{fill:#536a72}.cyan{fill:#70f3f2}.red{fill:#ff4c3a}.orange{fill:#ff9b52}.green{fill:#8cf0ad}.pink{fill:#f168d4}.small{font-size:11px}.tiny{font-size:9px}</style>
  </defs>
  <rect width="1440" height="900" fill="#05070d"/><rect width="1440" height="900" fill="url(#bg)"/><rect width="1440" height="900" fill="url(#grid)" opacity=".75"/>
  <path d="M0 155H1440" stroke="#70f3f2" stroke-opacity=".12"/><path d="M0 734H1440" stroke="#ff4c3a" stroke-opacity=".1"/>
  <g transform="translate(37 29)"><rect width="31" height="28" fill="none" stroke="#70f3f2"/><rect x="5" y="16" width="4" height="8" fill="#70f3f2"/><rect x="13" y="10" width="4" height="14" fill="#70f3f2"/><rect x="21" y="3" width="4" height="21" fill="#ff4c3a"/><text x="45" y="14" class="display text" font-size="19" font-weight="bold">CYBERGUARDIAN</text><text x="45" y="29" class="mono dim tiny">CONTROL PLANE / SOT-01</text></g>
  <g class="mono tiny"><circle cx="1143" cy="42" r="5" fill="#8cf0ad" filter="url(#glowR)"/><text x="1157" y="46" class="green">DEFENSE MODE</text><text x="1270" y="46" class="dim">LOCAL ONLY</text><text x="1363" y="46" class="cyan">18:48:09 UTC</text></g>

  <g transform="translate(72 132)"><text class="mono cyan tiny">NEO-TOKYO SIGNAL DESK / DESIGN LAB</text><text y="72" class="display text" font-size="87" font-weight="bold">ONE <tspan class="red">TRUTH.</tspan></text><text y="138" class="display" fill="none" stroke="#70f3f2" stroke-width="1" font-size="87" font-weight="bold">MANY GUARDIANS.</text><text y="181" class="display muted" font-size="18">Vier Live-Richtungen. Ein gemeinsamer Datenkern.</text><rect y="210" width="214" height="43" fill="#ff4c3a"/><text x="19" y="237" class="mono" fill="#160809" font-size="10" font-weight="bold">DESIGN LAB ÖFFNEN ↓</text><rect x="229" y="210" width="178" height="43" fill="#10242b" stroke="#70f3f2" stroke-opacity=".45"/><text x="248" y="237" class="mono cyan" font-size="10">COCKPIT ÖFFNEN ↗</text></g>
  <g transform="translate(1007 116)"><circle cx="150" cy="152" r="128" fill="none" stroke="#ff4c3a" stroke-opacity=".35"/><circle cx="150" cy="152" r="91" fill="#ff4c3a" fill-opacity=".21" stroke="#ff4c3a" stroke-opacity=".7" filter="url(#glowR)"/><circle cx="150" cy="152" r="51" fill="#ff4c3a" fill-opacity=".55"/><text x="133" y="165" fill="#ffd3cb" font-size="31">守</text><ellipse cx="150" cy="152" rx="205" ry="82" fill="none" stroke="#70f3f2" stroke-opacity=".6" transform="rotate(-18 150 152)"/><ellipse cx="150" cy="152" rx="178" ry="57" fill="none" stroke="#70f3f2" stroke-opacity=".32" transform="rotate(35 150 152)"/><circle cx="26" cy="112" r="8" fill="#8cf0ad"/><circle cx="283" cy="181" r="8" fill="#70f3f2"/><text x="-20" y="290" class="mono dim tiny">AGENT MESH / 04 ONLINE</text><text x="183" y="290" class="mono red tiny">SAFE MODE</text></g>

  <rect x="72" y="406" width="1296" height="65" fill="#10232a" stroke="#70f3f2" stroke-opacity=".28"/><text x="96" y="432" class="mono dim tiny">PROJECT OVERVIEW / WHY IT EXISTS</text><text x="96" y="456" class="display text" font-size="20" font-weight="bold">THE <tspan class="red">SHARED NERVE</tspan> FOR HUMAN + AGENT DEFENSE.</text><text x="1015" y="444" class="mono green tiny">04 AGENTS</text><text x="1122" y="444" class="mono orange tiny">03 PLANS</text><text x="1226" y="444" class="mono pink tiny">01 SIGNAL</text>

  <text x="72" y="530" class="mono cyan tiny">DESIGN LAB / CHOOSE A DIRECTION</text><text x="72" y="580" class="display text" font-size="43" font-weight="bold">FOUR WAYS TO <tspan class="red">GUARD.</tspan></text><text x="1120" y="575" class="mono orange tiny">NO DIRECTION LOCKED</text>
  <g transform="translate(72 616)">
    <g><rect width="306" height="214" fill="url(#card)" stroke="#70f3f2" stroke-opacity=".45"/><rect width="306" height="4" fill="#ff4c3a"/><rect x="14" y="17" width="278" height="76" fill="#0b2029" stroke="#70f3f2" stroke-opacity=".25"/><circle cx="155" cy="54" r="27" fill="#ff4c3a" fill-opacity=".38" stroke="#ff4c3a"/><ellipse cx="155" cy="54" rx="71" ry="22" fill="none" stroke="#70f3f2" stroke-opacity=".6"/><text x="22" y="113" class="mono red tiny">01 / SIGNAL DESK</text><text x="14" y="140" class="mono text small" font-weight="bold">NIGHTWATCH HUD</text><text x="14" y="161" class="display muted" font-size="12">Dichtes Neon-HUD mit Telemetrie</text><text x="14" y="177" class="display muted" font-size="12">und permanenter Signalbewegung.</text><text x="14" y="201" class="mono cyan tiny">ATMOSPHERE · PREVIEW ↗</text></g>
    <g transform="translate(324)"><rect width="306" height="214" fill="url(#card)" stroke="#f168d4" stroke-opacity=".5"/><rect width="306" height="4" fill="#f168d4"/><rect x="14" y="17" width="278" height="76" fill="#160e25" stroke="#f168d4" stroke-opacity=".27"/><ellipse cx="153" cy="54" rx="74" ry="27" fill="none" stroke="#f168d4" stroke-opacity=".7"/><ellipse cx="153" cy="54" rx="42" ry="68" fill="none" stroke="#70f3f2" stroke-opacity=".55" transform="rotate(-24 153 54)"/><circle cx="153" cy="54" r="17" fill="#f168d4" fill-opacity=".22" stroke="#f168d4"/><text x="22" y="113" class="mono pink tiny">02 / AGENT MESH</text><text x="14" y="140" class="mono text small" font-weight="bold">AGENT ORBIT</text><text x="14" y="161" class="display muted" font-size="12">Agenten kreisen um den gemeinsamen</text><text x="14" y="177" class="display muted" font-size="12">Control Plane. Kontext wird räumlich.</text><text x="14" y="201" class="mono cyan tiny">COORDINATION · PREVIEW ↗</text></g>
    <g transform="translate(648)"><rect width="306" height="214" fill="url(#card)" stroke="#8cf0ad" stroke-opacity=".5"/><rect width="306" height="4" fill="#8cf0ad"/><rect x="14" y="17" width="278" height="76" fill="#10221f" stroke="#8cf0ad" stroke-opacity=".28"/><rect x="29" y="31" width="112" height="24" fill="#8cf0ad" fill-opacity=".19" stroke="#8cf0ad"/><rect x="29" y="65" width="131" height="17" fill="none" stroke="#70f3f2"/><rect x="175" y="65" width="97" height="17" fill="none" stroke="#f7d66a"/><text x="22" y="113" class="mono green tiny">03 / OPERATOR VIEW</text><text x="14" y="140" class="mono text small" font-weight="bold">TACTICAL CONSOLE</text><text x="14" y="161" class="display muted" font-size="12">Ruhiger SOC-Look für Filter,</text><text x="14" y="177" class="display muted" font-size="12">Shortcuts und Tagesbetrieb.</text><text x="14" y="201" class="mono cyan tiny">CLARITY · PREVIEW ↗</text></g>
    <g transform="translate(972)"><rect width="324" height="214" fill="url(#card)" stroke="#ff9b52" stroke-opacity=".5"/><rect width="324" height="4" fill="#ff9b52"/><rect x="14" y="17" width="296" height="76" fill="#24151a" stroke="#ff9b52" stroke-opacity=".28"/><path d="M50 30V82M44 34h12M44 58h12M44 81h12" stroke="#ff9b52"/><circle cx="50" cy="34" r="5" fill="#ff4c3a"/><circle cx="50" cy="58" r="5" fill="#ff9b52"/><circle cx="50" cy="81" r="5" fill="#70f3f2"/><path d="M68 34H280M68 58H238M68 81H269" stroke="#ff9b52" stroke-opacity=".8"/><text x="22" y="113" class="mono orange tiny">04 / SIGNAL STORY</text><text x="14" y="140" class="mono text small" font-weight="bold">INCIDENT THEATRE</text><text x="14" y="161" class="display muted" font-size="12">Defensive Abläufe als Timeline:</text><text x="14" y="177" class="display muted" font-size="12">Signal bis zum Audit-Eintrag.</text><text x="14" y="201" class="mono cyan tiny">WORKFLOW · PREVIEW ↗</text></g>
  </g>
</svg>
