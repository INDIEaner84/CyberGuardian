name: Dependency Audit
on:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 3"
  workflow_dispatch:

jobs:
  deps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run OpenCode Dependency Audit
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # github-v1.2.19 (what "latest" pointed to), pinned to a commit
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: openrouter/google/gemini-2.5-flash
          # Workflow token instead of the OpenCode GitHub App exchange, which failed on
          # every run with "App token exchange failed: 502" (app not installed on the repo).
          use_github_token: true
          prompt: |
            Führe einen Dependency-Audit durch:
            
            1. PAKETERKENNUNG
            - Erkenne das Paket-System (npm, pip, cargo, go)
            - Sammle alle direkten und transitive Dependencies
            
            2. SICHERHEITS-CHECKS
            - Führe npm audit / pip-audit / cargo audit aus
            - Prüfe auf bekannte CVEs
            - Identifiziere kritische Schwachstellen
            
            3. VERALTETE PAKETE
            - Identifiziere veraltete Dependencies
            - Prüfe auf End-of-Life Pakete
            - Analysiere Major-Version-Unterschiede
            
            4. LIZENZ-ANALYSE
            - Sammle alle Lizenzen der Dependencies
            - Identifiziere Lizenzkonflikte (GPL vs Proprietär)
            
            Erstelle ein GitHub Issue für kritische Probleme.
            Bei keinen kritischen Problemen: Kein Issue erstellen.
