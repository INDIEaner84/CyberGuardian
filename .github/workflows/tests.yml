name: Tests

on:
  push:
    branches: [main, master, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile browser cockpit and core
        run: python -m compileall -q server.py launcher.py core utils tests

      - name: Run unit and API tests (standard library only)
        run: python -m unittest discover -s tests -v

  frontend:
    name: Frontend syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Check web/app.js syntax
        run: node --check web/app.js && node --check web/theme-boot.js

      - name: Check installer syntax
        run: bash -n install.sh

  e2e:
    name: Browser checks (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install browser test dependencies
        working-directory: tests/e2e
        run: npm ci --no-audit --no-fund

      # Uses the Google Chrome preinstalled on the runner (CHROME_BIN); no browser download.
      - name: Run browser checks (flows, style worlds, responsive, axe + pixel contrast)
        working-directory: tests/e2e
        run: npm test

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-failure-screenshots
          path: tests/e2e/artifacts/
          if-no-files-found: ignore
          retention-days: 7
